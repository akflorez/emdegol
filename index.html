<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMDEGOL - Podio Fase de Grupos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700;900&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-effects">
        <div class="hex-pattern"></div>
        <div class="stadium-lights"></div>
        <canvas id="confetti-canvas"></canvas>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="title-container">
                <h1 class="main-title glow-effect">EMDEGOL</h1>
                <h2 class="sub-title">PODIO FASE DE GRUPOS</h2>
            </div>
            
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <span class="stat-label">PARTICIPANTES</span>
                        <span class="stat-value scoreboard-font">34</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚽</div>
                    <div class="stat-info">
                        <span class="stat-label">PARTIDOS</span>
                        <span class="stat-value scoreboard-font">48 <span class="stat-sub">/ 72</span></span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <span class="stat-label">ACIERTOS</span>
                        <span class="stat-value scoreboard-font">934</span>
                    </div>
                </div>
                <div class="stat-card highlight-stat">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-info">
                        <span class="stat-label">PUNTAJE LÍDER</span>
                        <span class="stat-value scoreboard-font" id="leader-score">33</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="podium-area" id="podium-container">
            <!-- Podium elements will be generated by JavaScript -->
        </main>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
