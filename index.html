<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMDEGOL - Ganadores Oficiales</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700;900&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=6">
</head>
<body class="publication-mode">
    <div class="background-effects">
        <div class="hex-pattern"></div>
        <div class="stadium-lights"></div>
        <canvas id="confetti-canvas"></canvas>
    </div>

    <!-- Header -->
    <header class="header publication-header">
        <div class="title-container">
            <h1 class="main-title glow-effect">EMDEGOL</h1>
            <h2 class="sub-title">¡TENEMOS CAMPEONES!</h2>
            <div class="badge-final" style="background: var(--neon-yellow); color: black;">FINALIZADO</div>
        </div>
    </header>

    <div class="publication-container">
        
        <!-- Winners Podium -->
        <div class="publication-section">
            <div class="section-title main-candidatos" style="margin-top: 2rem;">
                <span class="fire-icon">🏆</span> EL PODIO OFICIAL <span class="fire-icon">🏆</span>
                <p class="section-subtitle">Los grandes ganadores del mundial</p>
            </div>
            <main class="podium-area publication-podium" id="podium-container">
                <!-- Podium elements generated by JS -->
            </main>
        </div>

        <!-- Premios -->
        <div class="publication-section">
            <section class="premios-section publication-premios">
                <div class="section-title main-candidatos" style="font-size: 3.5rem; margin-top: 3rem; margin-bottom: 2rem;">
                    <span class="money-icon">💰</span> GRAN PREMIACIÓN <span class="money-icon">💰</span>
                </div>
                <div class="premios-grid publication-premios-grid" style="gap: 2rem;">
                    <div class="premio-card border-yellow" style="padding: 2rem; transform: scale(1.05);">
                        <div class="trophy" style="font-size: 4rem;">🏆 1</div>
                        <div class="premio-info">
                            <span class="premio-lugar" style="font-size: 1.5rem;">Campeona:</span>
                            <span class="premio-monto text-yellow" style="font-size: 2.5rem; line-height: 1.2;">$700.000</span>
                        </div>
                    </div>
                    <div class="premio-card border-silver" style="padding: 2rem; transform: scale(1.05);">
                        <div class="trophy" style="font-size: 4rem;">🥈 2</div>
                        <div class="premio-info">
                            <span class="premio-lugar" style="font-size: 1.5rem;">Subcampeona:</span>
                            <span class="premio-monto text-silver" style="font-size: 2.5rem; line-height: 1.2;">$300.000</span>
                        </div>
                    </div>
                    <div class="premio-card border-bronze" style="padding: 2rem; transform: scale(1.05);">
                        <div class="trophy" style="font-size: 4rem;">🥉 3</div>
                        <div class="premio-info">
                            <span class="premio-lugar" style="font-size: 1.5rem;">Tercer Lugar:</span>
                            <span class="premio-monto text-bronze" style="font-size: 2.5rem; line-height: 1.2;">Premio sorpresa</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </div>

    <footer class="footer">
        <h2 class="footer-title">¡Gracias por participar! ⚽🔥</h2>
        <p class="footer-logo">E M D E C O B  S . A . S .</p>
    </footer>

    <script src="script.js?v=5"></script>
</body>
</html>
